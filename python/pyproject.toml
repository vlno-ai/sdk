[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vlno-sdk"
version = "0.12.0"
description = "VLNO SDK for hosted agent evaluations and live trajectories"
readme = "README.md"
authors = [{name = "VLNO"}]
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://vlno.ai"
Repository = "https://github.com/vlno-ai/sdk"
Documentation = "https://github.com/vlno-ai/sdk/blob/v0.12.0/docs/tutorial.md"
